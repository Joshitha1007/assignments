<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .template{
            display: flex;
            flex-wrap: wrap;
            justify-content: space-evenly;
            align-items: center;
            background-color: rgb(56, 55, 55);
            gap:5px;
            
        }
        .template div{
            border:2px solid black;
            background-color: white;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .dialog{
            position:fixed;
          
            width:60%;
            top:25%;
            left:25%;
            display: none;
            background-color: white;
            border-radius: 20px;
            box-shadow: 3px black;
            padding:10px;
        }
        .dialog button{
            position:absolute;
            right:10px;
            
        }
        
        
    </style>
</head>
<body>
    <div class="template" id="d1"></div>
    <div class="dialog" id="d2"></div>
    <script>
        var products;
        function genui(pro){
            products=pro
                products.forEach(function(ele,i){
                    let ind=i
                    var ndiv=document.createElement("div");
                    var nimg=document.createElement("img")
                    var ntitle=document.createElement("h2")
                    nimg.src=ele.thumbnail;
                    ntitle.innerText=ele.title;
                    
                    ndiv.appendChild(nimg)
                    ndiv.appendChild(ntitle)
                    ndiv.addEventListener("click",function(event){
                        document.getElementById("d2").innerHTML=""
                        dialog(ind);
                        
                        document.getElementById("d1").style.opacity=0.2;
                        document.getElementById("d2").style.display="block";

                    })
                    
                    
                    document.getElementById("d1").appendChild(ndiv)




                }
            )
            }   
       function fetchdata(){
     fetch("https://dummyjson.com/products").then(function(res){return res.json()}).then(function(data){
            genui(data.products);
            })
           

        }
        fetchdata();
        function dialog(index){
        
                        var nh2=document.createElement("h2")
                        nh2.innerText=products[index].title;
                        var nimg=document.createElement("img")
                        nimg.src=products[index].thumbnail;
                        var np=document.createElement("p")
                        np.innerText=products[index].description;
                        var btn=document.createElement("button")
                        btn.innerText="cancel";
                        btn.onclick=function(){
                           document.getElementById("d2").style.display="none";
                           document.getElementById("d1").style.opacity=1;
                           document.getElementById("d2").innerHTML=""

                        }
                        
                        document.getElementById("d2").appendChild(btn);
                         
                        document.getElementById("d2").appendChild(nh2)
                         document.getElementById("d2").appendChild(np);
                        document.getElementById("d2").appendChild(nimg)
                        
                        

        }
        
        
       
    </script>
</body>
</html>
